apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: upgrade-delta-pr-comment
  labels: {app.kubernetes.io/part-of: upgrade-delta}
spec:
  description: >-
    Submit the result to GitHub for CAB review. Renders the scorecard as a
    change-board comment — project grade, per-library before/after + lane, the
    B-vs-F "what the backport is worth" gap, and the named test plan with a
    reason for every RUN and skip — then posts it on the pull request. Runs in
    `finally`, so it comments on RED runs too (the tool blocked it, and says why).
    If no PR token is available (e.g. a manual run), it prints the comment to the
    log instead of posting, so it is always safe to run.
  params:
    - name: repo-owner
      type: string
      default: ""
    - name: repo-name
      type: string
      default: ""
    - name: pull-request-number
      type: string
      default: ""
    - name: github-api
      type: string
      default: "https://api.github.com"
      description: Change for GitHub Enterprise (e.g. https://ghe.example.com/api/v3)
  workspaces:
    - name: source
    - name: basic-auth
      description: PaC-provided git auth secret (key git-provider-token). Optional.
      optional: true
  steps:
    - name: comment
      image: registry.access.redhat.com/ubi9/python-311:latest
      workingDir: $(workspaces.source.path)
      script: |
        #!/usr/bin/env bash
        set -uo pipefail
        if [ ! -f out/scorecard.json ]; then
          echo "no out/scorecard.json — scan did not produce a scorecard; nothing to post."
          exit 0
        fi
        # 1) render scorecard markdown (tested renderer) + append the test plan
        python3 integration/github-action/pr_comment.py out/scorecard.json out/pr-comment.md
        python3 - <<'PY'
        import json, os
        body = open("out/pr-comment.md").read().rstrip()
        sel_path = "out/routing-out/selection-report.json"
        if os.path.exists(sel_path):
            rep = json.load(open(sel_path)); t = rep["totals"]
            body += f"\n\n### Test plan — {t['final']} of {t['suite']} test classes\n"
            body += "Every RUN carries a printed reason; skips are recorded too.\n\n"
            for s in rep["selected"]:
                body += f"- \u2705 **{s['test']}** — {s['reason']}\n"
            for m in rep["mandatory"]["appended"]:
                body += f"- \U0001f512 **{m}** — mandatory `@Tag(upgrade-gate)`, always runs\n"
            for s in rep["skipped"]:
                body += f"- \u26aa {s['test']} — {s['reason']}\n"
        body += ("\n---\n**CAB approval:** this comment is the change-board summary. "
                 "Approve by reviewing here and merging — branch protection requires this "
                 "check to pass.\n*Grade \u2265 D auto-fails the pipeline; any de-escalation is "
                 "signed off and recorded on the sealed evidence.*\n")
        open("out/pr-comment.md", "w").write(body)
        PY
        # 2) post to the PR if we have a token + PR context; otherwise print it
        OWNER="$(params.repo-owner)"; REPO="$(params.repo-name)"; PR="$(params.pull-request-number)"
        TOKEN_FILE="$(workspaces.basic-auth.path)/git-provider-token"
        if [ -n "$OWNER" ] && [ -n "$REPO" ] && [ -n "$PR" ] && [ -f "$TOKEN_FILE" ]; then
          echo "Posting CAB comment to $OWNER/$REPO PR #$PR ..."
          python3 - "$OWNER" "$REPO" "$PR" "$(params.github-api)" "$TOKEN_FILE" <<'PY'
        import json, sys, urllib.request
        owner, repo, pr, api, tokfile = sys.argv[1:6]
        token = open(tokfile).read().strip()
        body = open("out/pr-comment.md").read()
        url = f"{api}/repos/{owner}/{repo}/issues/{pr}/comments"
        req = urllib.request.Request(url, data=json.dumps({"body": body}).encode(),
                                     method="POST", headers={
                                         "Authorization": f"Bearer {token}",
                                         "Accept": "application/vnd.github+json",
                                         "Content-Type": "application/json"})
        try:
            with urllib.request.urlopen(req) as r:
                print("posted:", r.status, json.loads(r.read()).get("html_url", ""))
        except Exception as e:
            print("WARN: could not post comment:", e)
            print("---- comment body ----"); print(body)
        PY
        else
          echo "No PR token/context — printing the comment instead of posting:"
          echo "==================== CAB COMMENT ===================="
          cat out/pr-comment.md
          echo "===================================================="
        fi
