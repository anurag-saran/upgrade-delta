# Pipelines-as-Code Repository CR for the grade-C (human CAB) demo app.
apiVersion: pipelinesascode.tekton.dev/v1alpha1
kind: Repository
metadata:
  name: payments-service-grade-c
  namespace: upgrade-delta-demo
spec:
  url: "https://github.com/anurag-saran/payments-service-grade-c"
  git_provider:
    secret:
      name: upgrade-delta-provider-token
      key: provider.token
    webhook_secret:
      name: upgrade-delta-provider-token
      key: webhook.secret
