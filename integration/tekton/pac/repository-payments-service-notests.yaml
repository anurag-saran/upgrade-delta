# Pipelines-as-Code Repository CR for the no-tests (REACHABILITY_ONLY) demo app.
# Apply in upgrade-delta-demo alongside payments-service and upgrade-delta.
# Reuses the same provider token / webhook secret as upgrade-delta.
apiVersion: pipelinesascode.tekton.dev/v1alpha1
kind: Repository
metadata:
  name: payments-service-notests
  namespace: upgrade-delta-demo
spec:
  url: "https://github.com/anurag-saran/payments-service-notests"
  git_provider:
    secret:
      name: upgrade-delta-provider-token
      key: provider.token
    webhook_secret:
      name: upgrade-delta-provider-token
      key: webhook.secret
