apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: upgrade-delta-route
spec:
  description: >-
    Consumer-side test routing: joins the scan's routing payload with the
    per-test JaCoCo coverage map and emits the Surefire includes file, the
    selection report, and deploy-gate.json. Fails loudly (exit 3) if a
    declared mandatory test resolves to zero classes.
  params:
    - name: coverage-map
      type: string
      default: samples/tests/coverage.json
    - name: tests-dir
      type: string
      default: samples/tests
    - name: head-sha
      type: string
      default: "demo"
  workspaces:
    - name: source
  results:
    - name: TESTS_SELECTED
    - name: SUITE_SIZE
    - name: TESTS_PASSED
  steps:
    - name: route
      image: registry.access.redhat.com/ubi9/python-311:latest
      workingDir: $(workspaces.source.path)
      script: |
        #!/usr/bin/env bash
        set -euo pipefail
        python3 test_router.py out/routing.json \
          --coverage "$(params.coverage-map)" --tests-dir "$(params.tests-dir)" \
          --head-sha "$(params.head-sha)" --out-dir out/routing-out
        python3 - <<'PY'
        import json
        r = json.load(open("out/routing-out/selection-report.json"))
        open("$(results.TESTS_SELECTED.path)", "w").write(str(r["totals"]["final"]))
        open("$(results.SUITE_SIZE.path)", "w").write(str(r["totals"]["suite"]))
        PY
    - name: execute-selected
      image: registry.access.redhat.com/ubi9/openjdk-21:latest
      workingDir: $(workspaces.source.path)
      script: |
        #!/usr/bin/env bash
        set -euo pipefail
        CP=$(ls examples/demo-jars/*.jar | tr '\n' ':')
        java -cp "$CP" testing.MiniRunner out/routing-out/surefire-includes.txt \
          | tee /tmp/exec.log
        grep -oE '^  [0-9]+ test method' /tmp/exec.log | grep -oE '[0-9]+' \
          > "$(results.TESTS_PASSED.path)" || echo 0 > "$(results.TESTS_PASSED.path)"
