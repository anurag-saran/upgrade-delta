apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: upgrade-delta-live-diff
spec:
  description: >-
    The core of the live pipeline: runs `upgrade_delta.py analyze` on the
    ACTUAL old/new jars for THIS PR's specific version bump, against the
    ACTUAL freshly-built application jar -- a real, fresh delta, not a
    pre-published evidence file. Writes out/routing.json (consumed by
    upgrade-delta-select-tests, reused unchanged) and out/scorecard.json in
    the same shape upgrade-delta-summary / upgrade-delta-pr-comment already
    expect, so those two are also reused completely unchanged.
  params:
    - name: group
    - name: artifact
    - name: old-version
    - name: new-version
    - name: old-jar
      description: Path from upgrade-delta-resolve-jars' OLD_JAR result
    - name: new-jar
      description: Path from upgrade-delta-resolve-jars' NEW_JAR result
    - name: app-jar
      description: Path from upgrade-delta-resolve-jars' APP_JAR result
    - name: accept-transitive-scope
      type: string
      default: "false"
  workspaces:
    - name: source
  results:
    - name: PROJECT_GRADE_RECOMMENDED_PATH
      description: "The grade for this specific dependency bump (A-F)"
  steps:
    - name: diff
      displayName: "Diff the real jars for this PR's version bump"
      image: registry.access.redhat.com/ubi9/python-311:latest
      workingDir: $(workspaces.source.path)
      script: |
        #!/usr/bin/env bash
        set -euo pipefail
        mkdir -p out/reports
        EXTRA=""
        [ "$(params.accept-transitive-scope)" = "true" ] && EXTRA="--accept-transitive-scope"
        # shellcheck disable=SC2086
        python3 upgrade_delta.py analyze "$(params.old-jar)" "$(params.new-jar)" \
          --app "$(params.app-jar)" \
          --old-version "$(params.old-version)" --new-version "$(params.new-version)" \
          --library "$(params.group):$(params.artifact)" \
          --json out/live-delta.json --html out/reports/live-delta.html \
          --routing-payload out/routing.json --scorecard-compat out/scorecard.json $EXTRA
        GRADE=$(python3 -c "import json;p=json.load(open('out/scorecard.json'))['project'];print(p['headline_grade'])")
        printf '%s' "$GRADE" > "$(results.PROJECT_GRADE_RECOMMENDED_PATH.path)"
        echo "grade=$GRADE"
