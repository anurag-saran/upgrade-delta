apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: upgrade-delta-live
spec:
  description: >-
    Lives in YOUR APPLICATION's repo. On every PR: diffs pom.xml to find the
    one dependency version bump, resolves the real old/new jars (+ builds
    your app), computes a LIVE delta (not a pre-published evidence file),
    grades it, routes + runs only the tests it owes, then posts the verdict
    as a PR comment. If the PR doesn't touch a dependency version, the run
    still succeeds -- it just has nothing to grade.
  params:
    - name: git-url
    - name: git-revision
      default: main
    - name: target-branch
    - name: repo-owner
    - name: repo-name
    - name: pull-request-number
    - name: pom-path
      type: string
      default: pom.xml
    - name: app-module-dir
      type: string
      default: "."
    - name: coverage-map
      type: string
      default: "target/jacoco-per-test-coverage.json"
      description: >-
        REAL per-test JaCoCo coverage map (see integration/jacoco/README.md
        for how to generate one) -- NOT the demo's samples/tests/coverage.json
        fixture. If this file doesn't exist yet, select-tests correctly falls
        back to running the full suite (fail-closed), so this is safe to
        leave unset while you're still generating a real baseline.
    - name: tests-dir
      type: string
      default: "src/test/java"
    - name: accept-transitive-scope
      type: string
      default: "false"
    - name: scorecard-route-host
      type: string
      default: ""
  workspaces:
    - name: source
    - name: maven-settings
      description: Secret volume with settings.xml (Lightwell server credentials)
    - name: basic-auth
      description: PaC-provided git auth secret, for posting the CAB comment
  tasks:
    - name: clone
      displayName: "1. Clone the repo at this PR's commit"
      taskRef: {name: git-clone}
      workspaces: [{name: output, workspace: source}]
      params:
        - {name: url, value: $(params.git-url)}
        - {name: revision, value: $(params.git-revision)}

    - name: fetch-tool
      displayName: "2. Fetch the upgrade-delta tool scripts"
      runAfter: [clone]
      taskRef: {name: upgrade-delta-fetch-tool}
      workspaces: [{name: source, workspace: source}]

    - name: detect-change
      displayName: "3. Find which dependency version changed"
      runAfter: [fetch-tool]
      taskRef: {name: upgrade-delta-detect-change}
      workspaces: [{name: source, workspace: source}]
      params:
        - {name: target-branch, value: $(params.target-branch)}
        - {name: pom-path, value: $(params.pom-path)}

    - name: resolve-jars
      displayName: "4. Resolve the real jars + build the app"
      runAfter: [detect-change]
      when:
        - input: $(tasks.detect-change.results.HAS_CHANGE)
          operator: in
          values: ["true"]
      taskRef: {name: upgrade-delta-resolve-jars}
      workspaces:
        - {name: source, workspace: source}
        - {name: maven-settings, workspace: maven-settings}
      params:
        - {name: group, value: $(tasks.detect-change.results.CHANGED_GROUP)}
        - {name: artifact, value: $(tasks.detect-change.results.CHANGED_ARTIFACT)}
        - {name: old-version, value: $(tasks.detect-change.results.CHANGED_OLD_VERSION)}
        - {name: new-version, value: $(tasks.detect-change.results.CHANGED_NEW_VERSION)}
        - {name: app-module-dir, value: $(params.app-module-dir)}

    - name: live-diff
      displayName: "5. Diff the real jars for this PR's bump"
      runAfter: [resolve-jars]
      taskRef: {name: upgrade-delta-live-diff}
      workspaces: [{name: source, workspace: source}]
      params:
        - {name: group, value: $(tasks.detect-change.results.CHANGED_GROUP)}
        - {name: artifact, value: $(tasks.detect-change.results.CHANGED_ARTIFACT)}
        - {name: old-version, value: $(tasks.detect-change.results.CHANGED_OLD_VERSION)}
        - {name: new-version, value: $(tasks.detect-change.results.CHANGED_NEW_VERSION)}
        - {name: old-jar, value: $(tasks.resolve-jars.results.OLD_JAR)}
        - {name: new-jar, value: $(tasks.resolve-jars.results.NEW_JAR)}
        - {name: app-jar, value: $(tasks.resolve-jars.results.APP_JAR)}
        - {name: accept-transitive-scope, value: $(params.accept-transitive-scope)}

    - name: select-tests
      displayName: "6. Pick which tests this upgrade owes"
      runAfter: [live-diff]
      taskRef: {name: upgrade-delta-select-tests}
      workspaces: [{name: source, workspace: source}]
      params:
        - {name: coverage-map, value: $(params.coverage-map)}
        - {name: tests-dir, value: $(params.tests-dir)}
        - {name: head-sha, value: $(params.git-revision)}

    - name: run-tests
      displayName: "7. RUN the selected tests for real"
      runAfter: [select-tests]
      taskRef: {name: upgrade-delta-run-tests-maven}
      workspaces:
        - {name: source, workspace: source}
        - {name: maven-settings, workspace: maven-settings}
      params:
        - {name: app-module-dir, value: $(params.app-module-dir)}

  finally:
    - name: summary
      displayName: "8. Print the verdict banner"
      taskRef: {name: upgrade-delta-summary}
      workspaces: [{name: source, workspace: source}]
      params:
        - {name: scorecard-route-host, value: $(params.scorecard-route-host)}
    - name: pr-comment
      displayName: "9. Post CAB comment + test plan to the PR"
      taskRef: {name: upgrade-delta-pr-comment}
      workspaces:
        - {name: source, workspace: source}
        - {name: basic-auth, workspace: basic-auth}
      params:
        - {name: repo-owner, value: $(params.repo-owner)}
        - {name: repo-name, value: $(params.repo-name)}
        - {name: pull-request-number, value: $(params.pull-request-number)}

  results:
    - {name: HAS_CHANGE, value: $(tasks.detect-change.results.HAS_CHANGE)}
    - {name: CHANGED_GROUP, value: $(tasks.detect-change.results.CHANGED_GROUP)}
    - {name: CHANGED_ARTIFACT, value: $(tasks.detect-change.results.CHANGED_ARTIFACT)}
    - {name: CHANGED_OLD_VERSION, value: $(tasks.detect-change.results.CHANGED_OLD_VERSION)}
    - {name: CHANGED_NEW_VERSION, value: $(tasks.detect-change.results.CHANGED_NEW_VERSION)}
