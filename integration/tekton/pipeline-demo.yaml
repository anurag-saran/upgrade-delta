apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: upgrade-delta-demo
spec:
  description: >-
    Self-contained demo: clone the repo, run the coverage meter against the REAL
    Lightwell catalog, score the committed sample app (transitives, sign-off),
    route + run the selected tests, then print one VERDICT banner. Everything
    needed is committed under examples/ — one Python image plus a JDK for the
    test-execution step. The PipelineRun's Results (Output tab) and the summary
    task's log ARE the executive summary.
  params:
    - name: git-url
      type: string
    - name: git-revision
      type: string
      default: main
    - name: scorecard-route-host
      type: string
      default: ""
      description: Host of the scorecard viewer Route (optional; prints browsable links)
    - name: repo-owner
      type: string
      default: ""
    - name: repo-name
      type: string
      default: ""
    - name: pull-request-number
      type: string
      default: ""
    - name: fail-on
      type: string
      default: "D"
      description: >-
        Fail the PipelineRun when the project grade is this bad or worse.
        Applied AFTER tests run so scorecard.html still gets pass/fail outcomes.
  workspaces:
    - name: source
    - name: basic-auth
      description: PaC-provided git auth secret, for posting the CAB comment. Optional.
      optional: true
  tasks:
    - name: clone
      displayName: "1. Clone the repo at this PR's commit"
      taskRef: {name: git-clone}
      workspaces: [{name: output, workspace: source}]
      params:
        - {name: url, value: $(params.git-url)}
        - {name: revision, value: $(params.git-revision)}
    - name: coverage
      displayName: "2. Check Lightwell coverage for every dependency"
      runAfter: [clone]
      taskRef: {name: upgrade-delta-coverage}
      workspaces: [{name: source, workspace: source}]
      params:
        - {name: app-sbom, value: examples/demo-jars/payments-service.sbom.json}
    - name: scan
      displayName: "3. Grade the upgrade risk (reachability + sign-off)"
      runAfter: [coverage]
      taskRef: {name: upgrade-delta-scan}
      workspaces: [{name: source, workspace: source}]
      params:
        - {name: app-jar, value: examples/demo-jars/payments-service-1.0.0.jar}
        - {name: sbom, value: examples/demo-jars/payments-service.sbom.json}
        - {name: evidence-dir, value: examples/evidence}
        - {name: lib-jars, value: examples/demo-jars}
        - {name: accept-transitive-scope, value: "true"}
        # Empty: do not fail here — grade-gate after tests keeps the demo red
        # while still letting select/run populate scorecard test outcomes.
        - {name: fail-on, value: ""}
    - name: select-tests
      displayName: "4. Pick which tests this upgrade owes"
      runAfter: [scan]
      taskRef: {name: upgrade-delta-select-tests}
      workspaces: [{name: source, workspace: source}]
    - name: run-tests
      displayName: "5. RUN the selected tests for real"
      runAfter: [select-tests]
      # MiniRunner may fail some methods (missing transitive jars on the demo
      # classpath); continue so grade-gate + summary still run.
      onError: continue
      taskRef: {name: upgrade-delta-run-tests}
      workspaces: [{name: source, workspace: source}]
    - name: grade-gate
      displayName: "5b. Enforce project grade gate"
      runAfter: [run-tests]
      taskSpec:
        params:
          - {name: fail-on, type: string}
        steps:
          - name: gate
            image: registry.access.redhat.com/ubi9/python-311:latest
            workingDir: $(workspaces.source.path)
            script: |
              #!/usr/bin/env bash
              set -euo pipefail
              FAIL_ON="$(params.fail-on)"
              [ -n "$FAIL_ON" ] || { echo "fail-on empty — skipping grade gate"; exit 0; }
              python3 - <<PY
              import json, sys
              order = ["A", "B", "C", "D", "F"]
              sc = json.load(open("out/scorecard.json"))
              grade = sc["project"].get("headline_grade") or "-"
              fail_on = "$FAIL_ON"
              if grade == "-" or grade not in order or fail_on not in order:
                  print(f"grade={grade} fail-on={fail_on} — nothing to gate")
                  sys.exit(0)
              if order.index(grade) >= order.index(fail_on):
                  print(f"GATE: project grade {grade} breaches --fail-on {fail_on}")
                  sys.exit(2)
              print(f"grade={grade} within fail-on={fail_on}")
              PY
        workspaces:
          - {name: source}
      workspaces: [{name: source, workspace: source}]
      params:
        - {name: fail-on, value: $(params.fail-on)}
  finally:
    - name: summary
      displayName: "6. Print the verdict banner"
      taskRef: {name: upgrade-delta-summary}
      workspaces: [{name: source, workspace: source}]
      params:
        - {name: scorecard-route-host, value: $(params.scorecard-route-host)}
    - name: pr-comment
      displayName: "7. Post CAB comment + test plan to the PR"
      taskRef: {name: upgrade-delta-pr-comment}
      workspaces:
        - {name: source, workspace: source}
        - {name: basic-auth, workspace: basic-auth}
      params:
        - {name: source-label, value: "\U0001F9EA **FIXTURE DEMO** \u2014 fictitious acme-* libraries, always runs on every PR regardless of what changed. For the real analysis of THIS PR's actual change, see the other upgrade-delta comment below (posted by the live pipeline)."}
        - {name: repo-owner, value: $(params.repo-owner)}
        - {name: repo-name, value: $(params.repo-name)}
        - {name: pull-request-number, value: $(params.pull-request-number)}
  results:
    - {name: PROJECT_GRADE_RECOMMENDED_PATH, value: $(tasks.scan.results.PROJECT_GRADE_RECOMMENDED_PATH)}
    - {name: PROJECT_GRADE_WITHOUT_REMEDIATION, value: $(tasks.scan.results.PROJECT_GRADE_WITHOUT_REMEDIATION)}
    - {name: GRADE_SCALE_LEGEND, value: $(tasks.scan.results.GRADE_SCALE_LEGEND)}
    - {name: COVERAGE_PCT_EXACT_MATCH, value: $(tasks.coverage.results.COVERAGE_PCT_EXACT_MATCH)}
    - {name: DEPENDENCIES_COVERED_EXACT, value: $(tasks.coverage.results.DEPENDENCIES_COVERED_EXACT)}
    - {name: DEPENDENCIES_NEAR_OTHER_VERSION, value: $(tasks.coverage.results.DEPENDENCIES_NEAR_OTHER_VERSION)}
    - {name: DEPENDENCIES_UNCOVERED, value: $(tasks.coverage.results.DEPENDENCIES_UNCOVERED)}
    - {name: TEST_CLASSES_SELECTED_COUNT, value: $(tasks.select-tests.results.TEST_CLASSES_SELECTED_COUNT)}
    - {name: TEST_CLASSES_TOTAL_SUITE, value: $(tasks.select-tests.results.TEST_CLASSES_TOTAL_SUITE)}
    - {name: TEST_CLASSES_SELECTED_NAMES, value: $(tasks.select-tests.results.TEST_CLASSES_SELECTED_NAMES)}
    - {name: TEST_METHODS_PASSED_COUNT, value: $(tasks.run-tests.results.TEST_METHODS_PASSED_COUNT)}
    - {name: TEST_METHODS_FAILED_COUNT, value: $(tasks.run-tests.results.TEST_METHODS_FAILED_COUNT)}
    - {name: TESTS_ACTUALLY_EXECUTED_SUMMARY, value: $(tasks.run-tests.results.TESTS_ACTUALLY_EXECUTED_SUMMARY)}
