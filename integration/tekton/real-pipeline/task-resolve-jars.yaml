apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: resolve-jars
spec:
  description: >-
    Resolves the OLD and NEW dependency jars via Maven's own dependency:copy
    -- whichever repository actually has each (old may be plain
    community/Central, new is expected on Lightwell) -- and builds the
    application's own jar from source, so live-diff can diff them for real
    instead of reading a pre-published evidence file. Using Maven itself
    (not a hand-rolled URL) means this works through whatever repos/mirrors
    your pom.xml and settings.xml actually define, not just a hardcoded
    Central/Lightwell assumption.

    ASSUMES your pom.xml already declares the Lightwell repository
    (one-time setup, not per-PR). This task only supplies credentials via
    settings.xml -- the <id> in your pom's <repository> block MUST match the
    <server><id> in the settings.xml secret for credentials to apply. See
    sample-app/settings.xml.template.
  params:
    - name: group
      type: string
    - name: artifact
      type: string
    - name: old-version
      type: string
    - name: new-version
      type: string
    - name: app-module-dir
      type: string
      default: "."
      description: Directory containing the pom.xml to build (root, or a module path)
  workspaces:
    - name: source
    - name: maven-settings
      description: Secret volume containing settings.xml with Lightwell server credentials
  results:
    - name: OLD_JAR
      description: Path (in workspace) to the resolved OLD dependency jar
    - name: NEW_JAR
      description: Path (in workspace) to the resolved NEW dependency jar
    - name: APP_JAR
      description: Path (in workspace) to the freshly-built application jar
  steps:
    - name: resolve-and-build
      displayName: "Resolve dependency jars + build the app"
      image: registry.access.redhat.com/ubi9/openjdk-21:latest
      workingDir: $(workspaces.source.path)
      script: |
        #!/usr/bin/env bash
        set -euo pipefail
        mvn -v || { echo "mvn not found in this image"; exit 1; }
        SETTINGS="$(workspaces.maven-settings.path)/settings.xml"
        mkdir -p out/jars
        G="$(params.group)"; A="$(params.artifact)"
        OV="$(params.old-version)"; NV="$(params.new-version)"

        echo "resolving OLD: $G:$A:$OV"
        mvn -B -s "$SETTINGS" dependency:copy \
          -Dartifact="$G:$A:$OV:jar" -DoutputDirectory=out/jars \
          -Dmdep.stripVersion=false

        echo "resolving NEW: $G:$A:$NV"
        mvn -B -s "$SETTINGS" dependency:copy \
          -Dartifact="$G:$A:$NV:jar" -DoutputDirectory=out/jars \
          -Dmdep.stripVersion=false

        OLD_JAR="out/jars/${A}-${OV}.jar"
        NEW_JAR="out/jars/${A}-${NV}.jar"
        [ -f "$OLD_JAR" ] || { echo "FATAL: could not resolve $OLD_JAR"; exit 1; }
        [ -f "$NEW_JAR" ] || { echo "FATAL: could not resolve $NEW_JAR"; exit 1; }

        echo "building app module: $(params.app-module-dir)"
        ( cd "$(params.app-module-dir)" && mvn -B -s "$SETTINGS" -DskipTests package )
        APP_JAR=$(find "$(params.app-module-dir)/target" -maxdepth 1 -name '*.jar' \
                   -not -name '*-sources.jar' -not -name '*-javadoc.jar' -not -name 'original-*' \
                   | head -1)
        [ -n "$APP_JAR" ] || { echo "FATAL: no built app jar found under target/"; exit 1; }

        printf '%s' "$OLD_JAR" > "$(results.OLD_JAR.path)"
        printf '%s' "$NEW_JAR" > "$(results.NEW_JAR.path)"
        printf '%s' "$APP_JAR" > "$(results.APP_JAR.path)"
        echo "OLD_JAR=$OLD_JAR  NEW_JAR=$NEW_JAR  APP_JAR=$APP_JAR"
