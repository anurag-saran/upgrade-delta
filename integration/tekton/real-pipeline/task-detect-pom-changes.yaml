apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: detect-pom-changes
spec:
  description: >-
    Diffs pom.xml between the PR's target (base) branch and the PR head to
    find every dependency whose <version> changed, and flags the ones whose
    new version carries a Red Hat Lightwell build suffix (rhlw-NNNNN) as
    adoptions to grade downstream. Pure Python stdlib -- no Maven, no network.
  params:
    - name: target-branch
      type: string
      description: The PR's base/target branch (e.g. main)
    - name: pom-path
      type: string
      default: pom.xml
      description: Path to the pom.xml within the repo, if not at the root
  workspaces:
    - name: source
  results:
    - name: LIGHTWELL_ADOPTIONS_COUNT
      description: How many dependencies in this PR adopted a Lightwell (rhlw) build
  steps:
    - name: detect
      displayName: "Diff pom.xml for Lightwell adoptions"
      image: registry.access.redhat.com/ubi9/python-311:latest
      workingDir: $(workspaces.source.path)
      script: |
        #!/usr/bin/env bash
        set -euo pipefail
        mkdir -p out
        git config --global --add safe.directory "$(workspaces.source.path)"
        # Fetch the base branch so we can read its pom.xml as it stood before
        # this PR -- git-clone by default only brings the PR's own revision.
        git fetch --depth 50 origin "$(params.target-branch)"
        git show "origin/$(params.target-branch):$(params.pom-path)" > /tmp/base-pom.xml

        python3 .upgrade-delta/real-pipeline/scripts/detect_pom_changes.py \
          --base /tmp/base-pom.xml \
          --head "$(params.pom-path)" \
          --out out/changed-deps.json

        python3 -c "
        import json
        d = json.load(open('out/changed-deps.json'))
        open('$(results.LIGHTWELL_ADOPTIONS_COUNT.path)', 'w').write(str(len(d['lightwell_adopted'])))
        "
