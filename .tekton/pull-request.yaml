apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  annotations:
    pipelinesascode.tekton.dev/on-event: pull_request
    pipelinesascode.tekton.dev/on-target-branch: main
    pipelinesascode.tekton.dev/max-keep-runs: "5"
    pipelinesascode.tekton.dev/task: git-clone
  name: upgrade-delta-pr
spec:
  pipelineRef:
    name: upgrade-delta-demo
  params:
    - name: git-url
      value: '{{ repo_url }}'
    - name: git-revision
      value: '{{ revision }}'
  workspaces:
    - name: source
      volumeClaimTemplate:
        spec:
          accessModes: [ReadWriteOnce]
          resources:
            requests:
              storage: 1Gi
