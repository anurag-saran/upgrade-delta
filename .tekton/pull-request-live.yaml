apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  annotations:
    pipelinesascode.tekton.dev/on-event: "[pull_request]"
    pipelinesascode.tekton.dev/on-target-branch: "[main]"
    pipelinesascode.tekton.dev/max-keep-runs: "5"
    pipelinesascode.tekton.dev/pipeline: "integration/tekton/pipeline-demo.yaml"
    pipelinesascode.tekton.dev/task: "git-clone"
    pipelinesascode.tekton.dev/task-1: "integration/tekton/task-upgrade-delta-coverage.yaml"
    pipelinesascode.tekton.dev/task-2: "integration/tekton/task-upgrade-delta-scan.yaml"
    pipelinesascode.tekton.dev/task-3: "integration/tekton/task-upgrade-delta-select-tests.yaml"
    pipelinesascode.tekton.dev/task-4: "integration/tekton/task-upgrade-delta-run-tests.yaml"
    pipelinesascode.tekton.dev/task-5: "integration/tekton/task-upgrade-delta-summary.yaml"
    pipelinesascode.tekton.dev/task-6: "integration/tekton/task-upgrade-delta-pr-comment.yaml"
  name: upgrade-delta-pr
spec:
  pipelineRef:
    name: upgrade-delta-demo
  params:
    - name: git-url
      value: '{{ repo_url }}'
    - name: git-revision
      value: '{{ revision }}'
    # PaC fills these from the PR event so the CAB comment can be posted back:
    - name: repo-owner
      value: '{{ repo_owner }}'
    - name: repo-name
      value: '{{ repo_name }}'
    - name: pull-request-number
      value: '{{ pull_request_number }}'
    # Optional: your scorecard viewer Route host, for clickable links in the summary log.
    - name: scorecard-route-host
      value: ''
  workspaces:
    - name: source
      persistentVolumeClaim:
        claimName: upgrade-delta-reports
    # PaC injects the git provider token here; the pr-comment task reads it to post.
    - name: basic-auth
      secret:
        secretName: "{{ git_auth_secret }}"
