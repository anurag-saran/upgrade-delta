# Live pipeline trigger for this monorepo's sample-app (jackson Lightwell demo).
# Coexists with .tekton/pull-request.yaml (fixture). Separate PVC avoids collisions.
#
# Demo cycle: ./scripts/demo-live-cycle.sh start | finish
# auto-close-pr=true → after a real pom bump, close PR without merge so main
# stays on community jackson for the next demo.
apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  annotations:
    pipelinesascode.tekton.dev/on-event: "[pull_request]"
    pipelinesascode.tekton.dev/on-target-branch: "[main]"
    pipelinesascode.tekton.dev/max-keep-runs: "5"
    pipelinesascode.tekton.dev/pipeline: ".upgrade-delta/real-pipeline/pipeline-real.yaml"
    pipelinesascode.tekton.dev/task: "git-clone"
    pipelinesascode.tekton.dev/task-1: ".upgrade-delta/real-pipeline/task-detect-pom-changes.yaml"
    pipelinesascode.tekton.dev/task-2: ".upgrade-delta/real-pipeline/task-live-coverage.yaml"
    pipelinesascode.tekton.dev/task-3: ".upgrade-delta/real-pipeline/task-generate-evidence.yaml"
    pipelinesascode.tekton.dev/task-4: ".upgrade-delta/real-pipeline/task-run-tests-maven.yaml"
    pipelinesascode.tekton.dev/task-5: ".upgrade-delta/real-pipeline/task-upgrade-delta-select-tests.yaml"
    pipelinesascode.tekton.dev/task-6: ".upgrade-delta/real-pipeline/task-upgrade-delta-summary.yaml"
    pipelinesascode.tekton.dev/task-7: ".upgrade-delta/real-pipeline/task-upgrade-delta-pr-comment.yaml"
    pipelinesascode.tekton.dev/task-8: ".upgrade-delta/real-pipeline/task-resolve-and-grade-transitive.yaml"
  name: upgrade-delta-live-pr
spec:
  pipelineRef:
    name: upgrade-delta-live
  params:
    - name: git-url
      value: '{{ repo_url }}'
    - name: git-revision
      value: '{{ revision }}'
    - name: target-branch
      value: '{{ target_branch }}'
    - name: pom-path
      value: 'sample-app/pom.xml'
    - name: app-name
      value: 'payments-service'
    - name: app-module-dir
      value: 'sample-app'
    - name: fail-on
      value: 'D'
    - name: accept-transitive-scope
      value: 'false'
    - name: coverage-map
      value: 'sample-app/coverage-map.json'
    - name: tests-dir
      value: 'sample-app/src/test/java'
    - name: repo-owner
      value: '{{ repo_owner }}'
    - name: repo-name
      value: '{{ repo_name }}'
    - name: pull-request-number
      value: '{{ pull_request_number }}'
    - name: scorecard-route-host
      value: 'scorecard-upgrade-delta-demo.apps.asaran.na-launch.com'
    # Keep false in this monorepo: fixture + live both fire on one PR; auto-close
    # would cancel the other run. Use ./scripts/demo-live-cycle.sh finish instead.
    - name: auto-close-pr
      value: 'false'
  workspaces:
    - name: source
      persistentVolumeClaim:
        claimName: upgrade-delta-live-reports
    - name: maven-settings
      secret:
        secretName: lightwell-maven-settings
    - name: basic-auth
      secret:
        secretName: "{{ git_auth_secret }}"
