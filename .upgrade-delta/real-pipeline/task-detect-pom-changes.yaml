apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: detect-pom-changes
spec:
  description: >-
    Diffs pom.xml between the PR's target (base) branch and the PR head using
    detect_pom_changes.py (resolves Maven ${property} indirection). Writes the
    full change-set to out/changed-deps.json (version changes, Lightwell
    adoptions, added, removed). Surfaces the FIRST version change as Tekton
    results for transitive grading; generate-evidence grades EVERY change.
  params:
    - name: target-branch
      type: string
      description: The PR's base/target branch (e.g. main)
    - name: pom-path
      type: string
      default: pom.xml
      description: Path to the pom.xml within the repo, if not at the root
  workspaces:
    - name: source
  results:
    - name: VERSION_CHANGES_COUNT
      description: How many dependencies changed version in this PR
    - name: LIGHTWELL_ADOPTIONS_COUNT
      description: How many of those adopted a Lightwell (rhlw) build
    - name: HAS_CHANGE
      description: "'true' if at least one version change was detected, else 'false'"
    - name: CHANGED_GROUP
      description: Maven groupId of the first detected version change
    - name: CHANGED_ARTIFACT
      description: Maven artifactId of the first detected version change
    - name: CHANGED_OLD_VERSION
      description: Version on the target branch (before this PR)
    - name: CHANGED_NEW_VERSION
      description: Version on this PR's head
  steps:
    - name: detect
      displayName: "Diff pom.xml for dependency version changes"
      image: registry.access.redhat.com/ubi9/python-311:latest
      workingDir: $(workspaces.source.path)
      script: |
        #!/usr/bin/env bash
        set -euo pipefail
        mkdir -p out
        git config --global --add safe.directory "$(workspaces.source.path)"
        # Fetch the base branch so we can read its pom.xml as it stood before
        # this PR -- git-clone by default only brings the PR's own revision.
        git fetch --depth 50 origin "$(params.target-branch)"
        git show "origin/$(params.target-branch):$(params.pom-path)" > /tmp/base-pom.xml

        python3 .upgrade-delta/real-pipeline/scripts/detect_pom_changes.py \
          --base /tmp/base-pom.xml \
          --head "$(params.pom-path)" \
          --out out/changed-deps.json

        python3 - <<'PY'
        import json
        d = json.load(open("out/changed-deps.json"))
        changed = d["changed"]
        adopted = d.get("lightwell_adopted") or []
        open("$(results.VERSION_CHANGES_COUNT.path)", "w").write(str(len(changed)))
        open("$(results.LIGHTWELL_ADOPTIONS_COUNT.path)", "w").write(str(len(adopted)))
        if not changed:
            open("$(results.HAS_CHANGE.path)", "w").write("false")
            for p in ["$(results.CHANGED_GROUP.path)", "$(results.CHANGED_ARTIFACT.path)",
                      "$(results.CHANGED_OLD_VERSION.path)", "$(results.CHANGED_NEW_VERSION.path)"]:
                open(p, "w").write("")
        else:
            # Prefer a Lightwell adoption as the "primary" bump for transitive
            # grading; otherwise the first version change.
            pool = adopted if adopted else changed
            if len(changed) > 1:
                print(f"NOTE: {len(changed)} dependency version change(s) in this PR; "
                      f"generate-evidence will grade all of them. Primary (for "
                      f"transitive follow-up): "
                      f"{sorted(pool, key=lambda x: (x['group'], x['artifact']))[0]['group']}:"
                      f"{sorted(pool, key=lambda x: (x['group'], x['artifact']))[0]['artifact']}")
            e = sorted(pool, key=lambda x: (x["group"], x["artifact"]))[0]
            open("$(results.HAS_CHANGE.path)", "w").write("true")
            open("$(results.CHANGED_GROUP.path)", "w").write(e["group"])
            open("$(results.CHANGED_ARTIFACT.path)", "w").write(e["artifact"])
            open("$(results.CHANGED_OLD_VERSION.path)", "w").write(e["old_version"])
            open("$(results.CHANGED_NEW_VERSION.path)", "w").write(e["new_version"])
        PY
